<!doctype html><html><head><meta charset="utf-8">
<!-- Text layer for a "text behind the speaker" shot: render this as an overlay, make a person matte with
     personmatte.swift, then comp.py stacks footage + text + the person on top. Put the text where the head
     overlaps the middle letters. -->
<link rel="stylesheet" href="../lib/base.css"><script src="../lib/anim.js"></script>
<style>
#wrap{position:absolute;left:0;right:0;top:118px;text-align:center}
#t{font-family:var(--display);font-weight:800;font-size:262px;line-height:.86;letter-spacing:.02em;color:#fff;text-transform:uppercase;white-space:nowrap;text-shadow:0 10px 40px rgba(0,0,0,.18)}
#t .l{display:inline-block}
#k{font:800 34px var(--ui);letter-spacing:.5em;color:#fff;text-transform:uppercase;margin-top:6px;text-shadow:0 4px 18px rgba(0,0,0,.35)}
</style></head><body>
<div id="wrap"><div id="t"></div></div>
<script>
window.DUR = window.DUR || 4.0;
const C = window.CUES || {back: .3}; const txt = 'YOUR PLACE';
$('#t').innerHTML = [...txt].map(c => `<span class="l">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
const L = $$('#t .l');
window.render = t => {
  const t0 = C.back - .15, out = DUR;
  L.forEach((el, i) => {
    const a = P(t, t0 + i * .045, t0 + i * .045 + .7, 'outExpo');
    const b = P(t, out - .45 + i * .02, out - .1 + i * .02, 'inCubic');
    S(el, {y: mix(260, 0, a) + mix(0, -300, b), o: clamp(a * 1.6) * (1 - b)});
  });
  const drift = P(t, t0, out, 'linear');
  S($('#wrap'), {s: 1 + .04 * drift, y: -8 * drift});
};
</script></body></html>
